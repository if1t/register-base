<ng-container [ngTemplateOutlet]="readmode ? readTemplate : editTemplate">
  <ng-template #readTemplate>
    <div class="container container--read" [attr.sproc-param-style]="paramStyle">
      @if (label) {
        @switch (paramStyle) {
          @case ('filter') {
            <div class="label-wrapper">
              <span class="label">{{ label }}</span>
              <div class="dashed-row"></div>
            </div>
          }
          @default {
            <span class="label">{{ label }}</span>
            <div class="dashed-row"></div>
          }
        }
      }
      <div class="value">
        <span [tuiHint]="value && showedValue !== '-' ? showedValue : undefined">{{
          showedValue
        }}</span>
      </div>
    </div>
  </ng-template>
  <ng-template #editTemplate>
    <div class="container container--edit" [attr.sproc-param-style]="paramStyle">
      @if (label) {
        <div class="label-wrapper" [class.applied]="applied()">
          <span class="label" [class.required]="required">
            {{ label }}
          </span>
        </div>
      }
      @if (!hasNoLimits()) {
        <tui-textfield
          tuiAppearance="sproc-input-appearance"
          tuiTextfieldSize="m"
          [tuiTextfieldLabelOutside]="true"
          [tuiTextfieldCleaner]="forceClear"
          [tuiHint]="value && showedValue !== '-' ? hintContent : undefined"
        >
          <textarea
            tuiTextarea
            tuiTextfieldSize="m"
            [formControl]="control"
            [max]="max()"
            [min]="min()"
            [maxLength]="maxLength()"
            [limit]="maxLength()"
            [placeholder]="placeholder()"
          ></textarea>
          <ng-container *ngTemplateOutlet="invalidIcon"></ng-container>
        </tui-textfield>
      } @else {
        <tui-textfield
          tuiAppearance="sproc-input-appearance"
          tuiTextfieldSize="m"
          [tuiTextfieldLabelOutside]="true"
          [tuiTextfieldCleaner]="forceClear"
          [tuiHint]="value && showedValue !== '-' ? hintContent : undefined"
        >
          <textarea
            tuiTextarea
            tuiTextfieldSize="m"
            [formControl]="control"
            [max]="max()"
            [min]="min()"
            [placeholder]="placeholder()"
          ></textarea>
          <ng-container *ngTemplateOutlet="invalidIcon"></ng-container>
        </tui-textfield>
      }
      <ng-template #hintContent> {{ showedValue }} </ng-template>
    </div>
  </ng-template>
  <ng-template #invalidIcon>
    <div class="textfield-icons-container">
      @if (isInvalidAndNotPristine) {
        <sproc-param-invalid-icon></sproc-param-invalid-icon>
      }
    </div>
  </ng-template>
</ng-container>
